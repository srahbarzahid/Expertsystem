{% extends 'main/layout.html' %} {% load static %} {% block title %}Password
Reset Complete - Expert System{% endblock %} {% block style %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}" />
{% endblock %} {% block body %}
<div class="auth-container fade-in">
  <div class="col-md-6 col-lg-5">
    <div class="card bg-white text-center">
      <div class="card-header">
        <h3>Password Reset Complete</h3>
      </div>
      <div class="card-body p-5">
        <div class="mb-4">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="60"
            height="60"
            fill="rgb(0, 150, 255)"
            class="bi bi-check-circle-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"
            />
          </svg>
        </div>
        <p class="text-muted mb-4 fs-5">
          Your password has been successfully set.
        </p>
        <p class="text-muted">You may go ahead and log in now.</p>
        <a href="{% url 'login' %}" class="btn btn-auth mt-3">Log in</a>
      </div>
    </div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.add("auth-page");
  });
</script>
{% endblock %}
