{% extends 'main/layout.html' %} {% load static %} {% block title %}Reset
Password - Expert System{% endblock %} {% block style %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}" />
{% endblock %} {% block body %}
<div class="auth-container fade-in">
  <div class="col-md-6 col-lg-5">
    <div class="card bg-white">
      <div class="card-header text-center">
        <h3>Reset Password</h3>
        <p class="mb-0">
          Enter your email address to receive password reset instructions.
        </p>
      </div>
      <div class="card-body p-5">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_email" class="form-label fw-bold text-muted"
              >Email address</label
            >
            {{ form.email }}
          </div>
          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-auth">Send Reset Email</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.add("auth-page");
    var inputs = document.querySelectorAll("input");
    inputs.forEach(function (input) {
      if (input.type !== "hidden") input.classList.add("form-control");
    });
  });
</script>
{% endblock %}
